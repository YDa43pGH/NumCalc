name: NET Core CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем репозиторий
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Устанавливаем .NET SDK
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.111'

    # 3. Восстанавливаем NuGet-зависимости
    - name: Restore dependencies
      run: dotnet restore NumCalc.sln

    # 4. Проверяем форматирование линтером (dotnet format)
    - name: Check Formatting (Lint)
      run: dotnet format NumCalc.sln --verify-no-changes

    # 5. Собираем весь Solution (Core + App + Tests)
    - name: Build Solution
      run: dotnet build NumCalc.sln --configuration Release --no-restore

    # 6. Запускаем автоматические тесты из проекта NumCalc.Tests
    - name: Run Tests
      run: dotnet test NumCalc.sln --configuration Release --no-build --verbosity normal
